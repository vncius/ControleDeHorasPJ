# Atualizações de dependência (M9 de docs/plano-melhorias.md). PRs semanais,
# agrupando minor/patch para não virar enxurrada; major vem separado porque
# costuma exigir ajuste de código. Alertas de vulnerabilidade chegam na hora,
# independente desta agenda (Settings → Code security → Dependabot alerts).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    # @types/node acompanha o runtime (Node 22 no CI e em `engines`), não a
    # última major: tipos de Node 24+ deixariam usar API que não existe em produção.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
