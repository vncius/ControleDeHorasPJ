# nginx do frontend em container. Equivale ao Cloudflare Pages:
# - arquivos estáticos do build com os cabeçalhos de public/_headers
#   (sem HSTS/upgrade-insecure-requests, que não cabem em http://localhost).
#   Mudou a CSP lá? Atualize aqui também;
# - /api/* repassado ao backend com o path completo, como
#   functions/api/[[path]].ts (as rotas do backend já têm o prefixo /api).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Importação de planilhas: margem acima do limite de corpo do backend.
  client_max_body_size 21m;
  server_tokens off;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # Arquivo de configuração do Cloudflare, não deve ser servido.
  location = /_headers { return 404; }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # SPA: rotas do React caem no index.html.
    try_files $uri $uri/ /index.html;
  }
}
