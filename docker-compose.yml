# App completo em containers, apontando para o banco de produção (Atlas).
#
#   1. Crie um arquivo de variáveis FORA do projeto (ex.: na pasta do iCloud,
#      D:/iCloudDrive/Apps Pessoais - ENV/ControleDeHorasPj.env)
#      com os valores de produção. As variáveis estão no README, seção
#      "Rodando em Docker".
#   2. docker compose --env-file "D:/iCloudDrive/Apps Pessoais - ENV/ControleDeHorasPj.env" up -d --build
#      (ou exporte as variáveis no shell antes de `docker compose up`).
#   3. Abra http://localhost:8081 (ou a porta de APP_PORT).
#
# Depois de um git pull, o mesmo comando do passo 2 reconstrói as imagens.
# Parar: docker compose --env-file "D:/iCloudDrive/Apps Pessoais - ENV/ControleDeHorasPj.env" down
#
# Todas as variáveis chegam por interpolação (${...}), então qualquer arquivo
# passado em --env-file ou variável do shell vale; as obrigatórias param o
# compose com erro se faltarem.
#
# Só o frontend (nginx) fica exposto, e só nesta máquina (127.0.0.1); o
# backend é alcançado pela rede interna do compose via /api.
name: horas-pj

services:
  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:?defina MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-horas-pj}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (o mesmo de produção)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
      NODE_ENV: production
      PORT: "3001"
      CORS_ORIGIN: http://localhost:${APP_PORT:-8081}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
        VITE_LEGAL_CONTROLADOR: ${VITE_LEGAL_CONTROLADOR:-}
        VITE_LEGAL_CONTATO: ${VITE_LEGAL_CONTATO:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
